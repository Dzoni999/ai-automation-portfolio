<div class="grid gap-2 sm:grid-cols-3">
  @for (item of items(); track item.title) {
    <div class="micro-lift flex items-center gap-2.5 rounded-md border border-slate-900/10 bg-white/70 px-3 py-2.5 shadow-sm shadow-slate-200/40 dark:border-white/10 dark:bg-white/5 dark:shadow-black/10">
      <span class="grid h-7 w-7 shrink-0 place-items-center rounded-md border border-blue-500/20 bg-blue-600/10 text-blue-600 dark:text-blue-300">
        @switch (item.icon) {
          @case ('clock') { <svg lucideClock3 class="h-3.5 w-3.5" aria-hidden="true"></svg> }
          @case ('check') { <svg lucideCheckCircle2 class="h-3.5 w-3.5" aria-hidden="true"></svg> }
          @case ('wrench') { <svg lucideWrench class="h-3.5 w-3.5" aria-hidden="true"></svg> }
        }
      </span>
      <p class="text-xs font-semibold leading-5 text-slate-700 dark:text-zinc-200">{{ item.title }}</p>
    </div>
  }
</div>
