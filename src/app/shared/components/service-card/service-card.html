<article class="micro-lift group flex h-full flex-col rounded-lg border border-slate-900/10 bg-white p-5 shadow-sm shadow-slate-200/50 transition duration-300 hover:border-blue-500/40 hover:shadow-xl hover:shadow-slate-200/70 dark:border-white/10 dark:bg-white/5 dark:shadow-black/10 dark:hover:border-blue-400/45 dark:hover:shadow-blue-950/20">
  <div class="flex items-start justify-between gap-4">
    <h3 class="text-base font-semibold leading-6 text-slate-950 dark:text-white">{{ service().title }}</h3>
    <span class="shrink-0 rounded-md border border-blue-500/20 bg-blue-600/10 px-2.5 py-1 text-xs font-semibold text-blue-700 transition duration-300 group-hover:border-blue-500/35 group-hover:bg-blue-600/15 dark:text-blue-300">
      {{ service().price }}

  </div>
  <p class="mt-4 text-sm leading-6 text-slate-600 dark:text-zinc-400">{{ service().text }}</p>
</article>
