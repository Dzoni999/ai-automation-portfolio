<article class="micro-lift group flex h-full flex-col rounded-lg border border-slate-900/10 bg-white p-6 shadow-sm shadow-slate-200/50 transition duration-300 hover:border-blue-500/40 hover:shadow-xl hover:shadow-slate-200/70 dark:border-white/10 dark:bg-white/5 dark:shadow-black/10 dark:hover:border-blue-400/45 dark:hover:shadow-blue-950/20">
  <div class="grid h-10 w-10 place-items-center rounded-md border border-blue-500/20 bg-blue-600/10 text-blue-600 transition duration-300 group-hover:-translate-y-0.5 group-hover:bg-blue-600 group-hover:text-white dark:text-blue-300">
    @switch (service().icon) {
      @case ('document') {
        <svg lucideFileText class="h-5 w-5" aria-hidden="true"></svg>
      }
      @case ('email') {
        <svg lucideMailCheck class="h-5 w-5" aria-hidden="true"></svg>
      }
      @case ('chatbot') {
        <svg lucideBot class="h-5 w-5" aria-hidden="true"></svg>
      }
      @case ('workflow') {
        <svg lucideWorkflow class="h-5 w-5" aria-hidden="true"></svg>
      }
    }
  </div>
  <h3 class="mt-6 text-base font-semibold leading-6 text-slate-950 dark:text-white">{{ service().title }}</h3>
  <p class="mt-3 text-sm leading-6 text-slate-600 dark:text-zinc-400">{{ service().text }}</p>
</article>
