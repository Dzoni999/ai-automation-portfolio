<article class="micro-lift overflow-hidden rounded-lg border border-slate-900/10 bg-white shadow-sm shadow-slate-200/50 transition duration-300 hover:border-blue-500/40 hover:shadow-xl hover:shadow-slate-200/70 dark:border-white/10 dark:bg-white/5 dark:shadow-black/10 dark:hover:border-blue-400/45 dark:hover:shadow-blue-950/20">
  <div class="grid md:grid-cols-2">
    <div class="p-6 sm:p-8">
      <p class="text-xs font-semibold uppercase tracking-wide text-blue-600 dark:text-blue-400">{{ problemLabel() }}</p>
      <ul class="mt-5 grid gap-3" role="list">
        @for (item of caseStudy().problemItems; track item) {
          <li class="flex items-start gap-3 text-sm leading-6 text-slate-600 dark:text-zinc-400">
            <span class="mt-2 h-1.5 w-1.5 shrink-0 rounded-full bg-slate-400 dark:bg-zinc-500"></span>
            {{ item }}
          </li>
        }
      </ul>
    </div>
    <div class="border-t border-slate-900/10 bg-blue-600/5 p-6 md:border-l md:border-t-0 sm:p-8 dark:border-white/10 dark:bg-blue-500/10">
      <p class="text-xs font-semibold uppercase tracking-wide text-blue-600 dark:text-blue-300">{{ solutionLabel() }}</p>
      <ul class="mt-5 grid gap-3" role="list">
        @for (item of caseStudy().solutionItems; track item) {
          <li class="flex items-start gap-3 text-sm leading-6 text-slate-700 dark:text-zinc-200">
            <span class="mt-2 h-1.5 w-1.5 shrink-0 rounded-full bg-blue-500"></span>
            {{ item }}
          </li>
        }
      </ul>
    </div>
  </div>
  <div class="flex items-center gap-3 border-t border-slate-900/10 px-6 py-4 dark:border-white/10 sm:px-8">
    <span class="text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-zinc-500">{{ resultLabel() }}</span>
    <span class="rounded-md border border-emerald-500/20 bg-emerald-500/10 px-2.5 py-1 text-xs font-semibold text-emerald-700 dark:text-emerald-300">{{ caseStudy().resultBadge }}</span>
  </div>
</article>
