<article class="micro-lift h-full rounded-lg border border-slate-900/10 bg-white p-5 shadow-sm shadow-slate-200/50 transition duration-300 hover:border-blue-500/35 hover:shadow-xl hover:shadow-slate-200/70 dark:border-white/10 dark:bg-white/5 dark:shadow-black/10 dark:hover:border-blue-400/40 dark:hover:shadow-blue-950/20">
  <h3 class="text-lg font-semibold text-slate-950 dark:text-white">{{ caseStudy().title }}</h3>
  <div class="mt-5 space-y-4">
    <div>
      <p class="text-xs font-semibold uppercase text-blue-600 dark:text-blue-400">{{ problemLabel() }}</p>
      <p class="mt-1 text-sm leading-6 text-slate-600 dark:text-zinc-400">{{ caseStudy().problem }}</p>
    </div>
    <div>
      <p class="text-xs font-semibold uppercase text-blue-600 dark:text-blue-400">{{ solutionLabel() }}</p>
      <p class="mt-1 text-sm leading-6 text-slate-600 dark:text-zinc-400">{{ caseStudy().solution }}</p>
    </div>
    <div>
      <p class="text-xs font-semibold uppercase text-blue-600 dark:text-blue-400">{{ resultLabel() }}</p>
      <p class="mt-1 text-sm leading-6 text-slate-600 dark:text-zinc-400">{{ caseStudy().result }}</p>
    </div>
  </div>
</article>
