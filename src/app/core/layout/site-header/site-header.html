<header class="sticky top-0 z-50 border-b border-slate-900/10 bg-white/80 shadow-sm shadow-slate-900/5 backdrop-blur-xl transition-colors duration-300 dark:border-white/10 dark:bg-[#05070a]/80 dark:shadow-black/20">
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-5 sm:px-6 lg:px-8">
    <a href="#top" class="group flex min-w-0 items-center gap-3 rounded-md focus-visible:outline-none" (click)="closeMenu()">
      <img
  src="/logo.png"
  alt="Nikola Sajic"
  class="h-9 w-9 shrink-0 rounded-md object-cover"
/>
      <span class="min-w-0">
        <span class="block truncate text-sm font-semibold text-slate-950 dark:text-white">Nikola Sajic</span>
        <span class="block truncate text-xs text-slate-500 dark:text-zinc-400">{{ copy().header.role }}</span>
      </span>
    </a>

    <nav class="hidden items-center gap-1 md:flex" aria-label="Primary navigation">
      @for (item of navItems(); track item.href) {
        <a
          [href]="item.href"
          class="group relative rounded-md px-3 py-2 text-sm font-medium text-slate-600 transition duration-200 hover:bg-slate-950/5 hover:text-slate-950 dark:text-zinc-400 dark:hover:bg-white/10 dark:hover:text-white"
        >
          {{ item.label }}
          <span class="absolute bottom-1.5 left-3 right-3 h-px origin-left scale-x-0 bg-blue-500/70 transition-transform duration-300 group-hover:scale-x-100"></span>
        </a>
      }
    </nav>

    <div class="flex items-center gap-2">
      <button
        type="button"
        class="micro-lift inline-flex h-9 items-center gap-2 rounded-md border border-slate-200 bg-white px-2.5 text-xs font-semibold text-slate-700 shadow-sm shadow-slate-200/60 transition dark:border-white/10 dark:bg-white/5 dark:text-zinc-200 dark:shadow-black/20"
        [attr.aria-label]="language() === 'en' ? copy().header.switchToSerbian : copy().header.switchToEnglish"
        [attr.aria-pressed]="language() === 'sr'"
        (click)="toggleLanguage()"
      >
        <span
          class="rounded px-1.5 py-0.5 transition duration-200"
          [ngClass]="language() === 'en' ? 'bg-blue-600 text-white' : 'text-slate-500 dark:text-zinc-400'"
        >
          EN
        </span>
        <span
          class="rounded px-1.5 py-0.5 transition duration-200"
          [ngClass]="language() === 'sr' ? 'bg-blue-600 text-white' : 'text-slate-500 dark:text-zinc-400'"
        >
          SR
        </span>
      </button>

      <button
        type="button"
        class="micro-lift inline-flex h-9 items-center gap-2 rounded-md border border-slate-200 bg-white px-2.5 text-xs font-semibold text-slate-700 shadow-sm shadow-slate-200/60 transition dark:border-white/10 dark:bg-white/5 dark:text-zinc-200 dark:shadow-black/20"
        [attr.aria-label]="theme() === 'dark' ? copy().header.switchToLight : copy().header.switchToDark"
        [attr.aria-pressed]="theme() === 'dark'"
        (click)="toggleTheme()"
      >
        <span class="relative h-4 w-4 rounded-full border border-current">
          <span
            class="absolute inset-0.5 rounded-full bg-current transition duration-300"
            [ngClass]="theme() === 'dark' ? 'scale-50 translate-x-1' : 'scale-75'"
          ></span>
        </span>
        <span class="hidden sm:inline">{{ theme() === 'dark' ? copy().header.themeDark : copy().header.themeLight }}</span>
      </button>

      <button
        type="button"
        class="micro-lift inline-flex h-9 items-center rounded-md border border-slate-200 bg-white px-3 text-sm font-semibold text-slate-800 shadow-sm shadow-slate-200/60 md:hidden dark:border-white/10 dark:bg-white/5 dark:text-white dark:shadow-black/20"
        [attr.aria-expanded]="menuOpen()"
        [attr.aria-label]="menuOpen() ? copy().header.close : copy().header.menu"
        (click)="toggleMenu()"
      >
        {{ menuOpen() ? copy().header.close : copy().header.menu }}
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <nav class="border-t border-slate-900/10 bg-white px-5 py-3 shadow-lg shadow-slate-950/5 md:hidden dark:border-white/10 dark:bg-[#05070a] dark:shadow-black/30" aria-label="Mobile navigation">
      <div class="mx-auto grid max-w-7xl gap-1">
        @for (item of navItems(); track item.href) {
          <a
            [href]="item.href"
            class="rounded-md px-3 py-3 text-sm font-semibold text-slate-700 transition duration-200 hover:bg-slate-950/5 hover:text-slate-950 dark:text-zinc-200 dark:hover:bg-white/10 dark:hover:text-white"
            (click)="closeMenu()"
          >
            {{ item.label }}
          </a>
        }
      </div>
    </nav>
  }
</header>
