<footer class="border-t border-slate-900/10 bg-white/55 dark:border-white/10 dark:bg-white/[0.025]">
  <div class="mx-auto grid max-w-7xl gap-6 px-5 py-10 sm:px-6 md:grid-cols-[1fr_auto] lg:px-8">
    <div>
      <p class="text-sm font-semibold text-slate-950 dark:text-white">Nikola Sajic</p>
      <p class="mt-2 max-w-xl text-sm leading-6 text-slate-600 dark:text-zinc-400">{{ copy().footer.line }}</p>
      <p class="mt-1 text-sm leading-6 text-slate-500 dark:text-zinc-500">{{ copy().footer.availability }}</p>
    </div>
    <div class="flex flex-wrap items-start gap-2 text-sm font-medium text-slate-600 dark:text-zinc-400">
      <a class="micro-lift group inline-flex items-center gap-2 rounded-md px-2.5 py-2 transition hover:bg-blue-600/5 hover:text-blue-700 dark:hover:bg-white/5 dark:hover:text-blue-300" href="mailto:nikolasajic7@gmail.com" [attr.aria-label]="copy().footer.email">
        <svg lucideMail class="h-4 w-4" aria-hidden="true"></svg>
        {{ copy().footer.email }}
      </a>
      <a class="micro-lift group inline-flex items-center gap-1.5 rounded-md px-2.5 py-2 transition hover:bg-blue-600/5 hover:text-blue-700 dark:hover:bg-white/5 dark:hover:text-blue-300" href="https://www.linkedin.com/in/nikola-sajic/" target="_blank" rel="noopener noreferrer" [attr.aria-label]="copy().footer.linkedin">
        {{ copy().footer.linkedin }}
        <svg lucideArrowUpRight class="h-3.5 w-3.5 transition-transform duration-200 group-hover:-translate-y-0.5 group-hover:translate-x-0.5" aria-hidden="true"></svg>
      </a>
      <a class="micro-lift group inline-flex items-center gap-1.5 rounded-md px-2.5 py-2 transition hover:bg-blue-600/5 hover:text-blue-700 dark:hover:bg-white/5 dark:hover:text-blue-300" href="https://github.com/Dzoni999" target="_blank" rel="noopener noreferrer" [attr.aria-label]="copy().footer.github">
        {{ copy().footer.github }}
        <svg lucideArrowUpRight class="h-3.5 w-3.5 transition-transform duration-200 group-hover:-translate-y-0.5 group-hover:translate-x-0.5" aria-hidden="true"></svg>
      </a>
    </div>
    <p class="text-xs text-slate-500 dark:text-zinc-500 md:col-span-2">
      &copy; {{ year }} {{ copy().footer.copyright }}
    </p>
  </div>
</footer>
